spring.application.name=api-gateway
server.port=${PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ==============================
# DATA SERVICES
# ==============================

spring.cloud.gateway.server.webmvc.routes[0].id=data-ingestion-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${DATA_INGESTION_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/ingestion/**

spring.cloud.gateway.server.webmvc.routes[1].id=data-processing-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${DATA_PROCESSING_SERVICE_URL:http://localhost:8083}
